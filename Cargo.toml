[package]
name = "kovvboj"
version = "0.2.0"
edition = "2024"
description = "Cross-platform VJ app built on rustjay-engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kovvbojAV/kovvboj"

[features]
default = ["mixer", "egui", "webcam", "led"]
mixer = ["rustjay-engine/mixer", "dep:rustjay-mixer"]
webcam = ["rustjay-engine/webcam", "rustjay-io/webcam"]
led = ["rustjay-io/led"]
api = ["rustjay-engine/api", "dep:rustjay-api"]
egui = ["rustjay-engine/egui", "dep:egui", "dep:rustjay-gui", "rustjay-gui/egui"]
projection = ["rustjay-engine/projection", "dep:rustjay-projection", "rustjay-projection/surface-import"]
ndi = ["rustjay-engine/ndi", "rustjay-io/ndi"]
link = ["rustjay-engine/link"]
prodj = ["rustjay-engine/prodj"]
hap = ["dep:hap-wgpu", "rustjay-io/hap-encode"]
ffmpeg = ["rustjay-io/ffmpeg"]
sysmon = ["dep:sysinfo"]
# Laser decks: MadMapper laser materials rendered to 2D paths. Off by default —
# `laser` is the pipeline and preview, `laser-dac` adds hardware output, which
# pulls in libusb and CMake.
laser = ["dep:rustjay-laser"]
laser-dac = ["laser", "rustjay-laser/dac"]

[dependencies]
rustjay-engine = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd", default-features = false }
rustjay-gui    = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd", optional = true }
uuid           = { version = "1", features = ["v4"] }
rustjay-mixer  = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd", optional = true }
rustjay-isf    = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }
isf            = { git = "https://github.com/BlueJayLouche/isf.git" }
rustjay-core   = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }
rustjay-render = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }
rustjay-io     = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd", default-features = false }
rustjay-api    = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd", optional = true }
rustjay-projection = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd", optional = true }
rustjay-lighting   = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }
rustjay-ledmap     = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }
wgpu           = { version = "30.0", features = ["spirv", "gles"] }
bytemuck       = { version = "1.21", features = ["derive"] }
anyhow         = "1.0"
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
log            = "0.4"
env_logger     = "0.11"
image          = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph       = "0.2"
notify         = "8.0"
rustjay-laser  = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd", optional = true }
dirs           = "6.0"
rfd            = "0.15"
egui           = { version = "0.36", optional = true }
winit          = "0.30"
hap-wgpu       = { version = "0.3.0", optional = true }
sysinfo        = { version = "0.34", optional = true, default-features = false, features = ["system"] }

[dev-dependencies]
egui_kittest = { version = "=0.36.1", features = ["snapshot", "wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Not used in code: a direct dependency is what makes syphon-core's
# `links = "Syphon"` metadata (DEP_SYPHON_FRAMEWORK_DIR) visible to build.rs,
# which needs it to emit the runtime rpath for the bundled Syphon.framework.
syphon-core = "0.4.0"

# The engine's vendored forks. Cargo ignores a dependency's own [patch], so the
# engine's workspace patches are re-applied here, from the same engine rev.
[patch.crates-io]
wgpu-hal              = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }
nokhwa-bindings-macos = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }
imgui-wgpu            = { git = "https://github.com/BlueJayLouche/rustjay-engine", rev = "b7c5bd1f4e19428fc8ddbbd63fe13a6f4a3d8bbd" }

# Working on the engine alongside? Point every engine crate at a local checkout
# (keep the rev above in sync when you land the engine change):
# [patch."https://github.com/BlueJayLouche/rustjay-engine"]
# rustjay-engine     = { path = "../rustjay-engine/crates/rustjay-engine" }
# rustjay-core       = { path = "../rustjay-engine/crates/rustjay-core" }
# rustjay-render     = { path = "../rustjay-engine/crates/rustjay-render" }
# rustjay-io         = { path = "../rustjay-engine/crates/rustjay-io" }
# rustjay-gui        = { path = "../rustjay-engine/crates/rustjay-gui" }
# rustjay-mixer      = { path = "../rustjay-engine/crates/rustjay-mixer" }
# rustjay-isf        = { path = "../rustjay-engine/crates/rustjay-isf" }
# rustjay-api        = { path = "../rustjay-engine/crates/rustjay-api" }
# rustjay-projection = { path = "../rustjay-engine/crates/rustjay-projection" }
# rustjay-lighting   = { path = "../rustjay-engine/crates/rustjay-lighting" }
# rustjay-ledmap     = { path = "../rustjay-engine/crates/rustjay-ledmap" }
# rustjay-laser      = { path = "../rustjay-engine/crates/rustjay-laser" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "unwind"

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 1
